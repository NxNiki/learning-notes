name: toy_rides
version: '1.0.0'
profile: toy_rides         # which entry of profiles.yml to connect with

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]

# Defaults for every model in a folder; a `{{ config(...) }}` inside a model wins.
models:
  toy_rides:
    staging:
      +materialized: view
    marts:
      +materialized: table

seeds:
  toy_rides:
    raw_trips:
      +column_types:
        started_at: timestamp
        loaded_at: timestamp

vars:
  # The simulated "now": stg_trips only sees rows that had arrived by then.
  as_of: '2026-01-02 23:59:59'
  # Experiment groups for drivers, first match wins
  # (macros/experiment_group_case.sql turns them into a CASE).
  experiment_rules:
    - {label: holdout, op: in, values: [103]}
    - {label: A, op: last_digit_in, values: [1, 3, 5, 7, 9]}
    - {label: B, op: last_digit_in, values: [0, 2, 4, 6, 8]}
