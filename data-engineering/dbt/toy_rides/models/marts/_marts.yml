version: 2

models:
  - name: fct_trips
    description: One row per trip, latest version; incremental on loaded_at.
    columns:
      - name: trip_id
        tests: [unique, not_null]
      - name: status
        tests:
          - accepted_values:
              values: ['completed', 'cancelled']
      - name: driver_id
        tests:
          - relationships:
              to: ref('drivers')
              field: driver_id
      - name: fare
        tests: [non_negative]           # the generic test in tests/generic/non_negative.sql
      - name: experiment_group
        tests:
          - not_null:
              config:
                severity: warn          # report it, but do not fail the build

  - name: driver_day
    description: Trip statistics per driver and trip_date.
    tests:
      - unique_columns:
          columns: [driver_id, trip_date]
